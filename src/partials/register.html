<section class="register section" id="register">
  <div class="container register-container">
    <div class="register-content">
      <h2 class="register-title section-title">Register</h2>

      <form class="register-form" method="post">
        <label class="register-label">
          Name*
          <input
            class="register-input"
            type="text"
            name="name"
            placeholder="Emma"
            autocomplete="name"
            required
            pattern="[\p{L}' .\-]{2,64}"
            title="2–64 letters, spaces, apostrophes, dots or hyphens"
          />
        </label>

        <label class="register-label">
          Email*
          <input
            class="register-input"
            type="email"
            name="email"
            placeholder="hello@wildsketch.com"
            autocomplete="email"
            required
          />
        </label>

        <label class="register-label">
          Describe your skills
          <textarea
            class="register-input register-textarea"
            name="skills"
            placeholder="Type your skills..."
            maxlength="500"
          ></textarea>
        </label>

        <button class="register-btn" type="submit">Register</button>
      </form>
    </div>

    <picture class="register-picture">
      <source
        media="(min-width: 1440px)"
        width="640"
        height="734"
        srcset="
          ./img/register-img/register-desk.jpg    1x,
          ./img/register-img/register-desk@2x.jpg 2x
        "
      />
      <source
        media="(min-width: 768px)"
        width="704"
        height="362"
        srcset="
          ./img/register-img/register-tab.jpg    1x,
          ./img/register-img/register-tab@2x.jpg 2x
        "
      />
      <img
        class="register-img"
        src="./img/register-img/register-mob.jpg"
        srcset="
          ./img/register-img/register-mob.jpg    1x,
          ./img/register-img/register-mob@2x.jpg 2x
        "
        alt="Girl painting outdoors at an easel"
        width="335"
        height="286"
        loading="lazy"
      />
    </picture>
  </div>
</section>
